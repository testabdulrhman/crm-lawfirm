<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>شاشة المكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* شاشة عرض المكتب — تطبيق سامسونج (Tizen).
   الشاشة يراها كل زائر: لا أسماء موكّلين ولا عناوين قضايا ولا مهام؛ أرقام الملفات والمحاكم وأسماء الموظفين والأعداد فقط.
   2026-10-22 «كأني فاتح ويندوز 2000»: أُعيد التصميم — زجاج فوق خلفية بهالتين (كحلي عميق + شامبين)،
   بلا حدود ذهبية؛ ورموز الهوية الرسمية (ink #0B1220/#131C30 · gold #C9A982). */
:root{
  --ink:#0B1220; --ink-2:#131C30;
  --gold:#C9A982; --gold-2:#E4CDA8; --gold-soft:rgba(201,169,130,.14);
  --text:#F5F1EA; --muted:rgba(232,226,214,.58); --faint:rgba(232,226,214,.34);
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.035); --edge:rgba(255,255,255,.09);
  --session:#8FB4FF; --appt:#7FD6BC; --late:#FF8F86; --wa:#6BD49A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{color:var(--text);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 700px at 88% -8%, rgba(201,169,130,.20), transparent 62%),
    radial-gradient(1100px 800px at 4% 108%, rgba(64,104,206,.26), transparent 60%),
    radial-gradient(700px 600px at 46% 52%, rgba(40,72,140,.16), transparent 70%),
    linear-gradient(160deg, #0E1730 0%, #0B1220 55%, #090F1C 100%)}
/* شبكة صارمة بحواف متطابقة (2026-10-22 «ودي المربعات تكون بمحاذات بعض»):
   ترويسة بعرض الشاشة · الكاميرا بجانب «جدول اليوم» بارتفاع واحد · «العمل المفتوح» بجانب اليوم التالي · الخبر.
   في RTL العمود الأول هو الأيمن. */
.wrap{display:grid;grid-template-columns:40fr 60fr;grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "cam agenda" "work next" "tick tick";gap:22px;height:100vh;width:100vw;padding:30px 36px}
.head{grid-area:head} .cam{grid-area:cam} .agenda{grid-area:agenda} .work{grid-area:work} .next{grid-area:next} .ticker{grid-area:tick}

.glass{background:linear-gradient(180deg,var(--glass) 0%,var(--glass-2) 100%);border:1px solid var(--edge);border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}
.card{padding:24px 28px}
.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.title h2{font-size:25px;font-weight:600;letter-spacing:.2px}
.chips{display:flex;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:500;color:var(--muted);
  background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ===== الكاميرا ===== */
.cam{position:relative;aspect-ratio:16/9;border-radius:30px;overflow:hidden;background:#05080f;
  border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cam iframe{width:100%;height:100%;border:0;display:block}
.cam-badge{position:absolute;top:20px;right:20px;z-index:2;display:flex;align-items:center;gap:10px;
  background:rgba(11,18,32,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 18px;font-size:19px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:#FF5F57;box-shadow:0 0 0 4px rgba(255,95,87,.18);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cam-off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 40%,#1A2850 0%,#0B1220 72%);color:var(--muted);font-size:23px;text-align:center;padding:40px}
.cam-off .big{font-size:96px;font-weight:300;color:var(--text);line-height:1}

/* ===== العمل المفتوح ===== */
.work{display:flex;flex-direction:column;min-height:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.045);border-radius:18px;padding:8px 16px;height:62px}
.stat b{font-size:38px;font-weight:300;line-height:1}
.stat span{font-size:16px;color:var(--muted);line-height:1.25}
.stat.late b{color:var(--late)} .stat.wa b{color:var(--wa)}
.bars{flex:1 1 0;display:flex;flex-direction:column;gap:11px;overflow:hidden;min-height:0}
.bar{display:grid;grid-template-columns:170px 1fr 74px;align-items:center;gap:16px;font-size:19px;height:30px;line-height:30px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.track{height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.fill{height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-2) 100%);border-radius:5px}
.fill.late{background:var(--late);border-radius:5px 0 0 5px}
.bar .v{color:var(--muted);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ===== الترويسة ===== */
.head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 28px}
/* الشعار وحده — يحمل اسم الشركة داخله، فلا يُكتب الاسم بجانبه (طلب المدير 2026-10-22) */
.brand img{display:block;height:76px;width:auto}
.clockbox{display:flex;align-items:center;gap:26px}
.dl{font-size:18px;line-height:1.55;color:var(--muted);text-align:left;white-space:nowrap}
.dl b{display:block;color:var(--text);font-weight:500}
.clock{font-size:76px;font-weight:300;line-height:1;letter-spacing:1px;white-space:nowrap}
.clock small{font-size:30px;color:var(--muted);margin-right:10px;font-weight:400}
.weather{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:22px;padding:10px 18px;white-space:nowrap}
.weather .i{font-size:36px}
.weather b{display:block;font-size:30px;font-weight:500;line-height:1.1}
.weather small{display:block;font-size:15px;color:var(--muted)}

/* ===== الجدول ===== */
.agenda{display:flex;flex-direction:column;min-height:0}
.next{display:flex;flex-direction:column;min-height:0}
.list{flex:1 1 0;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:0}
.item{display:flex;align-items:center;gap:20px;padding:8px 18px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid transparent}
.item .t{flex:0 0 118px;text-align:center}
.item .t b{display:block;font-size:31px;font-weight:500;line-height:36px;height:36px;font-variant-numeric:tabular-nums}
.item .t small{display:block;font-size:16px;color:var(--muted);line-height:22px;height:22px}
.item .rail{flex:0 0 4px;align-self:stretch;border-radius:2px}
.item .body{flex:1;min-width:0}
/* ارتفاعات ثابتة للأسطر: الإيموجي يختلف ارتفاع سطره بين الأجهزة فيضلّل قياس القصّ */
.item .l1{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;height:34px;line-height:34px}
.item .l1 span.x{overflow:hidden;text-overflow:ellipsis}
.item .l2{font-size:17px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:24px;line-height:24px}
.kind{flex:0 0 auto;font-size:15px;font-weight:600;border-radius:999px;padding:3px 12px}
.kind.s{color:var(--session);background:rgba(143,180,255,.13)} .kind.a{color:var(--appt);background:rgba(127,214,188,.13)}
.rail.s{background:var(--session)} .rail.a{background:var(--appt)}
.who{flex:0 0 auto;display:flex;align-items:center;gap:10px;max-width:250px;font-size:19px;font-weight:500;color:var(--text)}
.who .av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#1A1408;background:linear-gradient(140deg,var(--gold-2),var(--gold))}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.none{color:var(--faint);font-size:17px}
.item.now{background:rgba(201,169,130,.10);border-color:rgba(201,169,130,.38)}
.item.past{opacity:.42}
.soon{flex:0 0 auto;font-size:15px;font-weight:600;color:#1A1408;background:var(--gold);border-radius:999px;padding:3px 12px}
.next .item{padding:6px 16px}
.next .item .l2{margin-top:1px}
.next .who .av{width:34px;height:34px;font-size:16px}
.next .item .t b{font-size:27px;line-height:32px;height:32px}
.next .item .l1{font-size:20px;height:30px;line-height:30px}
.calm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:23px;text-align:center}
.calm .e{font-size:46px}
.more{font-size:17px;color:var(--muted);text-align:center;height:26px;line-height:26px;flex:0 0 auto}

/* ===== الشريط السفلي ===== */
.ticker{display:flex;align-items:center;gap:22px;padding:18px 28px;border-radius:26px}
.tag{flex:0 0 auto;background:var(--gold-soft);color:var(--gold-2);border-radius:999px;padding:7px 18px;font-size:18px;font-weight:600;white-space:nowrap}
.news{min-width:0;flex:1}
.news .t{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news .w{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.bday{flex:0 0 auto;font-size:21px;font-weight:600;color:var(--gold-2);white-space:nowrap}
.foot{flex:0 0 auto;font-size:15px;color:var(--faint);white-space:nowrap}
.err{color:#ffb1ab;font-size:20px;text-align:center;padding:18px 0}
</style>
</head>
<body>
<div class="wrap">
    <div class="glass head">
      <div class="brand"><img src="logo.png" alt="شركة عبدالرحمن بن رضوان المشيقح للمحاماة وإدارة إجراءات الإفلاس"></div>
      <div class="clockbox">
        <div class="weather" id="weather" style="display:none"></div>
        <div class="dl" id="dateLine">—</div>
        <div class="clock"><span id="clockTime">--:--</span><small id="clockMer"></small></div>
      </div>
    </div>

    <div class="cam" id="cam">
      <div class="cam-off" id="camOff">
        <div class="big" id="camClock">--:--</div>
        <div id="camMsg">جارٍ تشغيل البث…</div>
      </div>
      <iframe id="camFrame" allow="autoplay; fullscreen"></iframe>
      <div class="cam-badge" id="camBadge" style="display:none"><span class="dot"></span><span id="camLabel">بث مباشر</span></div>
    </div>

    <div class="glass card work">
      <div class="title"><h2>العمل المفتوح</h2></div>
      <div class="stats">
        <div class="stat"><b id="stOpen">—</b><span>مهمة مفتوحة</span></div>
        <div class="stat late"><b id="stLate">—</b><span>متأخرة</span></div>
        <div class="stat wa"><b id="stWa">—</b><span>واتساب بانتظار رد</span></div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="glass card agenda">
      <div class="title"><h2>جدول اليوم</h2><div class="chips"><span id="todayDone"></span><span class="chips" id="todayChips"></span></div></div>
      <div class="list" id="todayList"><div class="err" style="color:var(--muted)">جارٍ التحميل…</div></div>
    </div>

    <div class="glass card next">
      <div class="title"><h2 id="nextTitle">الغد</h2><div class="chips" id="nextChips"></div></div>
      <div class="list" id="nextList"></div>
    </div>

  <div class="glass ticker">
    <span class="tag">خبر اليوم</span>
    <div class="news" id="news"><div class="t">—</div></div>
    <div class="bday" id="bday"></div>
    <div class="foot" id="lastUpdate"></div>
  </div>
</div>

<script>
/* ======================= CONFIG — يُملأ عند البناء (build.sh) ======================= */
var CONFIG = {
  SUPABASE_URL : 'https://zwaahunavepleczuamuy.supabase.co',
  SUPABASE_ANON: '__ANON_KEY__',
  BOARD_SECRET : '__BOARD_SECRET__',
  CAMERA_URL   : '__CAMERA_URL__',     /* go2rtc على الـiMac — فارغ = بلا كاميرا (تظهر ساعة كبيرة مكانها) */
  CAMERA_LABEL : 'بث مباشر — مدخل المكتب',
  LAT: 26.33, LON: 43.97,              /* بريدة */
  REFRESH_MS: 60 * 1000,               /* كل دقيقة (طلب المدير 2026-10-13) */
  RELOAD_MS : 12 * 60 * 60 * 1000
};
/* ==================================================================================== */

function esc(s){ return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function $(id){ return document.getElementById(id); }
var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var KIND = { case:'⚖️', legal_service:'📝', property:'🏠', bankruptcy:'🏦' };
var LAST = null;   /* آخر بيانات — يُعاد رسم الجدول كل نصف دقيقة ليتحرك «التالي» والعدّ التنازلي */

function hijri(d){
  try {
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day:'numeric', month:'long', year:'numeric' }).format(d);
  } catch (e) { return ''; }
}
function h12(d){ var h = d.getHours() % 12; return (h === 0 ? 12 : h) + ':' + pad2(d.getMinutes()); }
function mer(d){ return d.getHours() >= 12 ? 'م' : 'ص'; }

function tick(){
  var d = new Date();
  $('clockTime').innerHTML = h12(d);
  $('clockMer').innerHTML = mer(d);
  $('camClock').innerHTML = h12(d) + ' <span style="font-size:36px;color:rgba(232,226,214,.58)">' + mer(d) + '</span>';
  var hj = hijri(d);
  $('dateLine').innerHTML = '<b>' + DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</b>' +
    (hj ? esc(hj) : '');
}

/* «14:30» ← {h:'2:30', m:'م'} */
function t12(hhmm){
  if (!hhmm) return null;
  var p = String(hhmm).split(':'); var h = parseInt(p[0], 10);
  if (isNaN(h)) return null;
  var m = h >= 12 ? 'م' : 'ص'; h = h % 12; if (h === 0) h = 12;
  return { h: h + ':' + (p[1] || '00'), m: m };
}
function minutesOf(hhmm){ if (!hhmm) return null; var p = String(hhmm).split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10); }

/* ---------- الكاميرا (اختيارية) ---------- */
function initCamera(){
  var url = CONFIG.CAMERA_URL;
  if (!url || url.indexOf('__') === 0) { $('camMsg').innerHTML = ''; return; }
  var f = $('camFrame');
  f.onload = function(){ $('camOff').style.display = 'none'; $('camBadge').style.display = 'flex'; };
  $('camLabel').innerHTML = esc(CONFIG.CAMERA_LABEL);
  f.src = url;
  setTimeout(function(){
    if ($('camOff').style.display !== 'none') $('camMsg').innerHTML = 'البث غير متاح الآن — تحقّق من تشغيل الكاميرا على الـiMac';
  }, 15000);
}

/* ---------- الطقس (Open-Meteo بلا مفتاح) ---------- */
function wIcon(code){
  if (code === 0) return '☀️'; if (code <= 2) return '🌤️'; if (code === 3) return '☁️';
  if (code >= 45 && code <= 48) return '🌫️'; if (code >= 51 && code <= 67) return '🌧️';
  if (code >= 80 && code <= 82) return '🌦️'; if (code >= 95) return '⛈️'; return '🌡️';
}
function loadWeather(){
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.LAT + '&longitude=' + CONFIG.LON +
    '&current=temperature_2m,weather_code&timezone=Asia%2FRiyadh', true);
  x.timeout = 15000;
  x.onload = function(){
    try {
      var c = JSON.parse(x.responseText).current;
      /* «°» تُعزل اتجاهاً كي لا تنقلب في RTL */
      $('weather').innerHTML = '<span class="i">' + wIcon(c.weather_code) + '</span>' +
        '<span><b dir="ltr">' + Math.round(c.temperature_2m) + '°</b><small>بريدة</small></span>';
      $('weather').style.display = 'flex';
    } catch (e) {}
  };
  x.send();
}

/* ---------- الجدول: الجلسات والمواعيد معاً بترتيب الوقت ---------- */
function merge(sessions, appts){
  var out = [], i;
  for (i = 0; i < sessions.length; i++) out.push({ type: 's', time: sessions[i].time, d: sessions[i] });
  for (i = 0; i < appts.length; i++) out.push({ type: 'a', time: appts[i].time, d: appts[i] });
  out.sort(function(a, b){
    var x = minutesOf(a.time), y = minutesOf(b.time);
    if (x == null) return 1; if (y == null) return -1; return x - y;
  });
  return out;
}

function person(name){
  if (!name) return '<span class="who none">لم يُسند</span>';
  return '<span class="who"><span class="av">' + esc(name.charAt(0)) + '</span><span class="nm">' + esc(name) + '</span></span>';
}

function itemHtml(it, state, soonText){
  var t = t12(it.time), d = it.d, l1, l2;
  if (it.type === 's') {
    l1 = '<span class="kind s">جلسة</span><span class="x">' + (KIND[d.kind] || '⚖️') + ' ' + esc(d.office_num || '') + '</span>';
    l2 = d.court || ''; if (d.division) l2 = l2 ? l2 + ' — ' + d.division : d.division;
  } else {
    var how = d.method === 'remote' ? '💻 عن بُعد' : d.method === 'onsite' ? '🏢 حضوري في المكتب' : '';
    l1 = '<span class="kind a">موعد</span><span class="x">' + esc(how || 'موعد موكّل') + '</span>';
    l2 = [d.service, d.duration ? d.duration + ' دقيقة' : ''].filter(Boolean).join(' · ');
  }
  return '<div class="item ' + state + '">' +
    '<div class="t">' + (t ? '<b>' + t.h + '</b><small>' + t.m + '</small>' : '<b>—</b>') + '</div>' +
    '<div class="rail ' + it.type + '"></div>' +
    '<div class="body"><div class="l1">' + l1 + (soonText ? '<span class="soon">' + soonText + '</span>' : '') + '</div>' +
    (l2 ? '<div class="l2">' + esc(l2) + '</div>' : '') + '</div>' +
    person(d.lawyer) + '</div>';
}

function count(n, one, two, many){ return n === 1 ? one : n === 2 ? two : n + ' ' + many; }
function chips(nS, nA){
  var h = '';
  if (nS) h += '<span class="chip"><i style="background:var(--session)"></i>' + count(nS, 'جلسة واحدة', 'جلستان', 'جلسات') + '</span>';
  if (nA) h += '<span class="chip"><i style="background:var(--appt)"></i>' + count(nA, 'موعد واحد', 'موعدان', 'مواعيد') + '</span>';
  return h;
}

/* الفائت: جلسة مضت عليها ساعة، أو موعد انتهت مدته */
function renderToday(){
  if (!LAST) return;
  var list = merge(LAST.sessions || [], LAST.appointments || []);
  $('todayChips').innerHTML = chips((LAST.sessions || []).length, (LAST.appointments || []).length);
  var el = $('todayList');
  $('todayDone').innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="calm"><span class="e">☕</span>لا جلسات ولا مواعيد اليوم</div>'; return; }
  var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), nextDone = false, h = '';
  for (var i = 0; i < list.length; i++){
    var it = list[i], m = minutesOf(it.time), state = '', soon = '';
    var end = m == null ? null : m + (it.type === 'a' ? (it.d.duration || 60) : 60);
    if (end != null && end <= nowMin) state = 'past';
    else if (!nextDone && m != null) {
      nextDone = true; state = 'now';
      var diff = m - nowMin;
      soon = diff <= 0 ? 'الآن' : diff < 60 ? 'بعد ' + diff + ' دقيقة' : 'التالي';
    }
    h += itemHtml(it, state, soon);
  }
  el.innerHTML = h;
  trimToday(el);
}

/* حين يضيق الجدول يُطوى ما انتهى أولاً (رقاقة «✓ ن انتهت» في رأس البطاقة) فيبقى القادم ظاهراً، ثم يُقصّ من الآخر */
function trimToday(el){
  var past = 0, rest = 0, g = 0, bottom = null;
  while (el.scrollHeight > el.clientHeight + 2 && g++ < 60){
    var items = el.getElementsByClassName('item'), p = el.querySelectorAll('.item.past');
    if (items.length <= 1) break;
    if (p.length) { p[0].parentNode.removeChild(p[0]); past++; }
    else { items[items.length - 1].parentNode.removeChild(items[items.length - 1]); rest++; }
    if (past) $('todayDone').innerHTML = '<span class="chip">✓ ' + past + (past === 1 ? ' انتهى' : ' انتهت') + '</span>';
    if (rest) {
      if (!bottom) { bottom = document.createElement('div'); bottom.className = 'more'; el.appendChild(bottom); }
      bottom.innerHTML = '+ ' + rest + ' أخرى';
    }
  }
}

/* «الغد» = يوم العمل التالي؛ بعد الخميس يُسمّى اليوم باسمه */
function nextTitle(iso){
  if (!iso) return 'الغد';
  var d = new Date(iso + 'T12:00:00');
  var t = new Date(); t.setHours(12, 0, 0, 0);
  return Math.round((d - t) / 86400000) === 1 ? 'الغد' : 'يوم ' + DAYS[d.getDay()];
}

function renderNext(){
  if (!LAST) return;
  var list = merge(LAST.next_sessions || [], LAST.next_appointments || []);
  $('nextTitle').innerHTML = esc(nextTitle(LAST.next_day));
  $('nextChips').innerHTML = chips((LAST.next_sessions || []).length, (LAST.next_appointments || []).length);
  var el = $('nextList');
  if (!list.length) { el.innerHTML = '<div class="calm" style="font-size:20px">لا شيء في الجدول بعد</div>'; return; }
  var h = '';
  for (var i = 0; i < list.length; i++) h += itemHtml(list[i], '', '');
  el.innerHTML = h;
  trim(el, list.length);
}

function renderTasks(t, wa){
  $('stOpen').innerHTML = t.open; $('stLate').innerHTML = t.late; $('stWa').innerHTML = wa;
  var max = 1, i;
  for (i = 0; i < t.by_member.length; i++) if (t.by_member[i].open > max) max = t.by_member[i].open;
  var h = '';
  for (i = 0; i < t.by_member.length; i++){
    var m = t.by_member[i];
    var ok = m.open - m.late;
    h += '<div class="bar"><span class="n">' + esc(m.name) + '</span><span class="track">' +
      (m.late ? '<span class="fill late" style="width:' + (m.late / max * 100) + '%"></span>' : '') +
      '<span class="fill" style="width:' + (ok / max * 100) + '%"></span></span>' +
      '<span class="v">' + m.open + (m.late ? ' · <span style="color:var(--late)">' + m.late + '</span>' : '') + '</span></div>';
  }
  $('bars').innerHTML = h || '<div class="calm" style="font-size:20px">لا مهام مفتوحة ✓</div>';
  trimBars();
}

function renderTicker(news, bdays){
  $('news').innerHTML = news
    ? '<div class="t">' + esc(news.title) + '</div><div class="w">لماذا يهمّنا: ' + esc(news.why) + '</div>'
    : '<div class="t" style="color:var(--muted);font-weight:400">لا خبر قانوني جديد اليوم</div>';
  $('bday').innerHTML = bdays && bdays.length ? '🎂 كل عام وأنت بخير يا ' + esc(bdays.join(' و')) : '';
}

/* القائمة لا تُقصّ بصمت — ما لا يتسع يُعلَن عنه */
function trim(el, total){
  var rows = el.getElementsByClassName('item'), g = 0;
  while (el.scrollHeight > el.clientHeight + 2 && rows.length > 1 && g++ < 60) rows[rows.length - 1].parentNode.removeChild(rows[rows.length - 1]);
  if (rows.length < total) {
    var more = document.createElement('div'); more.className = 'more';
    more.innerHTML = '+ ' + (total - rows.length) + ' أخرى';
    el.appendChild(more);
    while (el.scrollHeight > el.clientHeight + 2 && rows.length > 1 && g++ < 60) {
      rows[rows.length - 1].parentNode.removeChild(rows[rows.length - 1]);
      more.innerHTML = '+ ' + (total - rows.length) + ' أخرى';
    }
  }
}
function trimBars(){
  var el = $('bars'), rows = el.getElementsByClassName('bar'), g = 0;
  while (el.scrollHeight > el.clientHeight + 2 && rows.length > 1 && g++ < 30) rows[rows.length - 1].parentNode.removeChild(rows[rows.length - 1]);
}

/* القصّ يقيس الارتفاع؛ فيُعاد الرسم بعد اكتمال الخط (الخط البديل أطول فيُقصّ أكثر من اللازم) وكل نصف دقيقة */
function renderAll(){
  if (!LAST) return;
  renderToday(); renderNext();
  renderTasks(LAST.tasks_summary || { open: 0, late: 0, by_member: [] }, LAST.wa_waiting || 0);
  renderTicker(LAST.news, LAST.birthdays);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderAll(); });
window.addEventListener('resize', function(){ renderAll(); });

function showError(msg){ if (!LAST) $('todayList').innerHTML = '<div class="err">' + esc(msg) + '</div>'; else $('lastUpdate').innerHTML = esc(msg); }

function loadData(){
  var x = new XMLHttpRequest();
  x.open('GET', CONFIG.SUPABASE_URL + '/functions/v1/tv-board?k=' + encodeURIComponent(CONFIG.BOARD_SECRET), true);
  x.setRequestHeader('apikey', CONFIG.SUPABASE_ANON);
  x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_ANON);
  x.timeout = 20000;
  x.onload = function(){
    var d = null; try { d = JSON.parse(x.responseText); } catch (e) {}
    if (x.status !== 200 || !d || !d.ok) { showError('تعذّر تحديث البيانات — ستُعاد المحاولة تلقائياً'); return; }
    LAST = d;
    renderAll();
    var n = new Date(); $('lastUpdate').innerHTML = 'آخر تحديث ' + h12(n) + ' ' + mer(n);
  };
  x.onerror = function(){ showError('تعذّر الوصول للخادم — تحقّق من الشبكة'); };
  x.ontimeout = function(){ showError('انتهت مهلة الاتصال — ستُعاد المحاولة'); };
  x.send();
}

/* أزرار الريموت: «رجوع» لا يغلق الشاشة بالخطأ */
document.addEventListener('keydown', function(e){ if (e.keyCode === 10009) e.preventDefault(); });

tick(); setInterval(tick, 10000);
initCamera(); loadWeather(); loadData();
setInterval(loadData, CONFIG.REFRESH_MS);
setInterval(renderAll, 30 * 1000);
setInterval(loadWeather, 30 * 60 * 1000);
setTimeout(function(){ location.reload(); }, CONFIG.RELOAD_MS);
</script>
